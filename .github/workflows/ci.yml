# CI gates for raglogs. Enforces what the project actually cares about:
# ruff lint, unit tests with a src/core coverage floor, and integration tests
# against a real Postgres+pgvector service — across the supported Python range.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raglogs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/raglogs
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: make lint
      - name: Unit tests (with src/core coverage floor)
        # Floor starts at the current level (~87%); ratchet upward over time,
        # never set an aspirational number that turns main red.
        run: pytest tests/unit/ --cov=src/core --cov-report=term-missing --cov-fail-under=85
      - name: Integration tests (real Postgres + pgvector)
        run: make test-int

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Export OpenAPI
        run: PYTHONPATH=. python scripts/export_openapi.py
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi.json
          path: clients/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker build smoke test
        run: docker build -t raglogs:ci .

  # The unit/integration jobs build the schema with Base.metadata.create_all, so
  # they never exercise the Alembic chain. This proves the migrations actually
  # apply to a clean database (a broken migration would otherwise pass PR CI).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raglogs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/raglogs
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply migrations to a clean database
        run: alembic upgrade head

  publish-openapi-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: openapi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download OpenAPI artifact
      uses: actions/download-artifact@v8
      with:
        name: openapi.json
        path: artifacts
    - name: Attach openapi.json to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/openapi.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
