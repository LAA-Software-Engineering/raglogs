[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglogs"
version = "0.1.0"
description = "Incident explanation tool for production logs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer[all]>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary,pool]>=3.1.0",
    "pgvector>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "boto3>=1.34.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "prometheus_client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
    "moto[logs]>=5.0.0",
]

[project.scripts]
raglogs = "src.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep the historical ruff default set. Newer ruff releases enable many extra
# rule families by default, which flags the existing codebase.
select = ["E4", "E7", "E9", "F"]
