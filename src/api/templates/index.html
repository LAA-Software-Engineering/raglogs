<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>raglogs</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">raglogs</div>
    <div class="ingestion-picker">
      <label for="ingestion-select">ingestion</label>
      <select id="ingestion-select" disabled>
        <option value="">loading…</option>
      </select>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="explain">Explain</button>
    <button class="tab-btn" data-tab="timeline">Timeline</button>
    <button class="tab-btn" data-tab="compare">Compare</button>
    <button class="tab-btn" data-tab="ask">Ask</button>
  </nav>

  <main class="content">

    <!-- Explain -->
    <section class="panel tab-panel active" id="panel-explain">
      <form class="window-form" data-endpoint="/v1/query/explain" data-render="explain">
        <div class="presets">
          <button type="button" class="preset-btn" data-since="15m">15m</button>
          <button type="button" class="preset-btn" data-since="1h">1h</button>
          <button type="button" class="preset-btn active" data-since="2h">2h</button>
          <button type="button" class="preset-btn" data-since="24h">24h</button>
        </div>
        <label>since <input type="text" name="since" value="2h" class="since-input"></label>
        <label>service <input type="text" name="service" placeholder="optional"></label>
        <label>env <input type="text" name="env" placeholder="optional"></label>
        <button type="submit" class="run-btn">Explain</button>
      </form>
      <div class="result" id="result-explain">
        <p class="empty-state">Pick a window and click Explain.</p>
      </div>
    </section>

    <!-- Timeline -->
    <section class="panel tab-panel" id="panel-timeline">
      <form class="window-form" data-endpoint="/v1/query/timeline" data-render="timeline">
        <div class="presets">
          <button type="button" class="preset-btn" data-since="15m">15m</button>
          <button type="button" class="preset-btn" data-since="1h">1h</button>
          <button type="button" class="preset-btn active" data-since="2h">2h</button>
          <button type="button" class="preset-btn" data-since="24h">24h</button>
        </div>
        <label>since <input type="text" name="since" value="2h" class="since-input"></label>
        <label>service <input type="text" name="service" placeholder="optional"></label>
        <label>env <input type="text" name="env" placeholder="optional"></label>
        <button type="submit" class="run-btn">Build timeline</button>
      </form>
      <div class="result" id="result-timeline">
        <p class="empty-state">Pick a window and click Build timeline.</p>
      </div>
    </section>

    <!-- Compare -->
    <section class="panel tab-panel" id="panel-compare">
      <form class="window-form" data-endpoint="/v1/query/compare" data-render="compare">
        <div class="presets" data-preset-target="since">
          <button type="button" class="preset-btn" data-since="15m">15m</button>
          <button type="button" class="preset-btn active" data-since="30m">30m</button>
          <button type="button" class="preset-btn" data-since="1h">1h</button>
          <button type="button" class="preset-btn" data-since="2h">2h</button>
        </div>
        <label>since (incident) <input type="text" name="since" value="30m" class="since-input"></label>
        <label>baseline <input type="text" name="baseline" value="24h" class="since-input"></label>
        <label>service <input type="text" name="service" placeholder="optional"></label>
        <label>env <input type="text" name="env" placeholder="optional"></label>
        <button type="submit" class="run-btn">Compare</button>
      </form>
      <div class="result" id="result-compare">
        <p class="empty-state">Pick a window and baseline, then click Compare.</p>
      </div>
    </section>

    <!-- Ask -->
    <section class="panel tab-panel" id="panel-ask">
      <form class="window-form" data-endpoint="/v1/query/ask" data-render="ask">
        <div class="presets">
          <button type="button" class="preset-btn" data-since="15m">15m</button>
          <button type="button" class="preset-btn" data-since="1h">1h</button>
          <button type="button" class="preset-btn active" data-since="2h">2h</button>
          <button type="button" class="preset-btn" data-since="24h">24h</button>
        </div>
        <label>since <input type="text" name="since" value="2h" class="since-input"></label>
        <label>service <input type="text" name="service" placeholder="optional"></label>
        <label class="question-label">question
          <input type="text" name="question" placeholder="e.g. why did checkout fail?" class="question-input" required>
        </label>
        <button type="submit" class="run-btn">Ask</button>
      </form>
      <div class="result" id="result-ask">
        <p class="empty-state">Ask a question about the selected window.</p>
      </div>
    </section>

  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
